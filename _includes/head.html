<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <!-- Crawlers: allow large previews in Discover / social feeds, unless the page opts out -->
  {% if page.robots %}
    <meta name="robots" content="{{ page.robots | escape }}">
    <meta name="googlebot" content="{{ page.robots | escape }}">
  {% else %}
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="googlebot" content="index, follow">
  {% endif %}
  <meta name="theme-color" content="#0a0a0c">
  <meta name="color-scheme" content="dark">
  <meta name="author" content="{{ site.default_author.name }}">
  <meta name="publisher" content="F9XR Team">

  {% if page.keywords %}
  <meta name="keywords" content="{{ page.keywords }}">
  {% endif %}

  <!-- Open Graph extras that jekyll-seo-tag does not emit -->
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{% if page.image_alt %}{{ page.image_alt | escape }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="article:publisher" content="{{ site.url }}{{ site.baseurl }}/">
  <meta name="twitter:site" content="@{{ site.twitter_username }}">
  <meta name="twitter:creator" content="@{{ site.twitter_username }}">
  <meta name="twitter:image:alt" content="{% if page.image_alt %}{{ page.image_alt | escape }}{% else %}{{ site.title }}{% endif %}" />

  <!-- Feed + sitemap autodiscovery -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS" href="{{ '/rss.xml' | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} Atom" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="alternate" type="application/feed+json" title="{{ site.title }} JSON Feed" href="{{ '/feed.json' | absolute_url }}">
  <link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | absolute_url }}">
  <link rel="llms" href="{{ '/llms.txt' | absolute_url }}">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/site-images/logo.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/site-images/logo.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

  <!-- Analytics (GoatCounter — cookie-less, consent-free) -->
  {% if site.analytics and site.analytics.provider == 'goatcounter' and site.analytics.id %}
  <script data-goatcounter="https://{{ site.analytics.id }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <noscript><img src="https://{{ site.analytics.id }}.goatcounter.com/count?p=/test" alt="" referrerpolicy="no-referrer-when-downgrade"></noscript>
  {% endif %}
</head>
