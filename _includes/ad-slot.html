{% comment %} Renders an AdSense unit only when ads are enabled AND a publisher id
is configured (set in _config.yml after AdSense approval; adds ads.txt too). {% endcomment %}
{% if site.ads.enabled and site.ads.publisher %}
<div class="ad-slot">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-{{ site.ads.publisher }}"
       data-ad-slot="{{ include.slot }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>
{% endif %}
