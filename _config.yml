# Site identity -----------------------------------------------------------
title: "The DESI Sikka"
tagline: "Crypto news, zero jargon"
email: "hello@thedesisikka.in"
description: >-
  The DESI Sikka covers crypto for readers worldwide: bitcoin and ethereum
  news, altcoin moves, DeFi explainers, exchange guides and the regulation
  updates that matter, with deep coverage of India. Plain English, no jargon
  walls.

url: "https://ttearncrypto.github.io"
baseurl: "/thedesisikka"

# Social -------------------------------------------------------------------
twitter_username: "ttearncrypto"
telegram_url: "https://t.me/+CxO1NVTowno2Y2E1"
github_username: "ttearncrypto"
website_credit_url: "https://ttearncrypto.github.io"

# SEO / social cards ---------------------------------------------------------
logo: "/assets/site-images/logo.png"
social_image: "/assets/site-images/og-default.png"
image: "/assets/site-images/og-default.png"
title_separator: "|"
twitter:
  card: summary_large_image
  username: "ttearncrypto"
lang: en

# --- AdSense / Search Console hooks -----------------------------------------
# After linking the site in Google AdSense / Search Console, paste the HTML-
# verification token below: the jekyll-seo-tag plugin outputs the
# <meta name="google-site-verification"> tag from it.
#   google_site_verification: "PASTE_TOKEN_HERE"
#
# Once AdSense is approved and serving, add an ads.txt file in the repo root:
#   google.com, pub-XXXXXXXXXXXXXXXX, DIRECT, f08c47fec0942fa0

# --- Google News / Discover launch checklist (manual) ---------------------------
# 1. Set the repo Pages source to "GitHub Actions" (Settings > Pages) so
#    .github/workflows/pages.yml builds and deploys with CI validation.
# 2. In Search Console: verify the site as a property, then paste the
#    verification token into `google_site_verification` above and push.
# 3. Add the site in Google News Publisher Center; wait for the News/Discover
#    review queue. Requirements already met: Article + free content, robots
#    allows indexing, full-text feeds, noindex on search/404/feeds.

# Author --------------------------------------------------------------------
default_author:
  name: "F9XR News Desk"
  avatar: "/assets/authors/f9xr.webp"
  bio: >-
    The F9XR News Desk is a team of journalists working around the clock to
    gather, verify and report crypto news, market analysis and policy
    updates. One desk, every timezone.
author_links:
  - { name: Website,   url: "https://f9xr.github.io/" }
  - { name: LinkedIn,  url: "https://linkedin.com/company/f9xrteam" }
  - { name: Instagram, url: "https://instagram.com/f9xrteam" }
  - { name: YouTube,   url: "https://youtube.com/@QuarterlyLIV" }
  - { name: Pinterest, url: "https://pinterest.com/f9xr" }
  - { name: GitHub,    url: "https://github.com/f9xr" }

# Analytics -------------------------------------------------------------------
# GoatCounter is a privacy-first, cookie-less analytics service. The id is your
# subdomain (eg "thedesisikka" for https://thedesisikka.goatcounter.com).

analytics:
  provider: goatcounter
  id: "thedesisikka"

# Newsletter (Buttondown) ------------------------------------------------------
# id is your Buttondown username / page slug, eg https://buttondown.com/thedesisikka
newsletter:
  provider: buttondown
  id: "thedesisikka"

# Ads --------------------------------------------------------------------------
# After AdSense approval:
#   1. paste the pub id here, set enabled:true, and add ads.txt in the repo root:
#      google.com, pub-XXXXXXXXXXXXXXXX, DIRECT, f08c47fec0942fa0
#   2. drop `{% include ad-slot.html slot="NNNNNNNNNN" %}` into _layouts/post.html
#      (inside .prose after a paragraph) and/or the sidebar; the slot ids come from
#      each ad unit you create in AdSense. The include renders nothing until enabled.
ads:
  enabled: false
  publisher: ""

# Build ----------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /news/:slug/
timezone: Asia/Kolkata

kramdown:
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

rss: rss

titles_from_headings:
  strip_title: true
  collections: true

# Categories used across the site --------------------------------------------
site_categories:
  - { slug: bitcoin,    name: "Bitcoin" }
  - { slug: ethereum,   name: "Ethereum" }
  - { slug: altcoins,   name: "Altcoins" }
  - { slug: regulation, name: "Regulation" }
  - { slug: defi,       name: "DeFi & Web3" }
  - { slug: exchanges,  name: "Exchanges & How-to" }

# Defaults ---------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: newsdesk
      comments: false
      image: /assets/site-images/og-default.png
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      image: /assets/site-images/og-default.png

# Exclude from build -------------------------------------------------------------
exclude:
  - skills/
  - todo.txt
  - Gemfile
  - Gemfile.lock
  - README.md
