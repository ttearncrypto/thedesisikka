# Site identity -----------------------------------------------------------
title: "The DESI Sikka"
tagline: "Crypto news, zero jargon"
email: "hello@thedesisikka.in"
description: >-
  The DESI Sikka covers crypto for readers worldwide: bitcoin and ethereum
  news, altcoin moves, DeFi explainers, exchange guides and the regulation
  updates that matter, with deep coverage of India. Plain English, no jargon
  walls.

url: "https://ttearncrypto.github.io"
baseurl: "/thedesisikka"

# Social -------------------------------------------------------------------
twitter_username: "ttearncrypto"
telegram_url: "https://t.me/+CxO1NVTowno2Y2E1"
github_username: "ttearncrypto"
website_credit_url: "https://ttearncrypto.github.io"

# SEO / social cards ---------------------------------------------------------
logo: "/assets/site-images/logo.png"
social_image: "/assets/site-images/og-default.png"
twitter:
  card: summary_large_image
lang: en

# Author --------------------------------------------------------------------
default_author:
  name: "F9XR News Desk"
  avatar: "/assets/authors/f9xr.webp"
  bio: >-
    The F9XR News Desk is a team of journalists working around the clock to
    gather, verify and report crypto news, market analysis and policy
    updates. One desk, every timezone.
author_links:
  - { name: Website,   url: "https://f9xr.github.io/" }
  - { name: LinkedIn,  url: "https://linkedin.com/company/f9xrteam" }
  - { name: Instagram, url: "https://instagram.com/f9xrteam" }
  - { name: YouTube,   url: "https://youtube.com/@QuarterlyLIV" }
  - { name: Pinterest, url: "https://pinterest.com/f9xr" }
  - { name: GitHub,    url: "https://github.com/f9xr" }

# Build ----------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /news/:slug/
timezone: Asia/Kolkata

kramdown:
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

rss: rss

titles_from_headings:
  strip_title: true
  collections: true

# Categories used across the site --------------------------------------------
site_categories:
  - { slug: bitcoin,    name: "Bitcoin" }
  - { slug: ethereum,   name: "Ethereum" }
  - { slug: altcoins,   name: "Altcoins" }
  - { slug: regulation, name: "Regulation" }
  - { slug: defi,       name: "DeFi & Web3" }
  - { slug: exchanges,  name: "Exchanges & How-to" }

# Defaults ---------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: newsdesk
      comments: false
      image: /assets/site-images/og-default.png
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      image: /assets/site-images/og-default.png

# Exclude from build -------------------------------------------------------------
exclude:
  - skills/
  - todo.txt
  - Gemfile
  - Gemfile.lock
  - README.md
