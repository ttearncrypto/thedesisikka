<!DOCTYPE html>
<html lang="en" data-baseurl="{{ site.baseurl }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="frame">
      {% include header.html %}
      <main class="site-main" id="main">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>

    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | append: site.baseurl | jsonify }},
      "logo": {{ site.url | append: site.baseurl | append: site.logo | jsonify }},
      "sameAs": [
        "https://twitter.com/{{ site.twitter_username }}",
        "https://instagram.com/{{ site.instagram_username }}",
        {{ site.telegram_url | jsonify }},
        "https://github.com/{{ site.github_username }}"
      ]
    }
    </script>
    {% capture search_template %}{{ site.url }}{{ site.baseurl }}/pages/search/{search_term_string}{% endcapture %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | append: site.baseurl | jsonify }},
      "description": {{ site.description | strip_html | jsonify }},
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": {{ search_template | jsonify }}
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </body>
</html>
