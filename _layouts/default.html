<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="frame">
      {% include header.html %}
      <main class="site-main" id="main">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | append: site.baseurl | jsonify }},
      "logo": {{ site.url | append: site.baseurl | append: site.logo | jsonify }},
      "sameAs": [
        "https://twitter.com/{{ site.twitter_username }}",
        "https://instagram.com/{{ site.instagram_username }}",
        "https://t.me/{{ site.telegram_username }}"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | append: site.baseurl | jsonify }},
      "description": {{ site.description | strip_html | jsonify }},
      "inLanguage": "en-IN"
    }
    </script>
  </body>
</html>
