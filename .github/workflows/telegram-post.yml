name: Telegram auto-poster

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SITE_RSS: "https://ttearncrypto.github.io/thedesisikka/rss.xml"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore last-sent state
        uses: actions/cache/restore@v4
        id: state-cache
        with:
          path: telegram-state.json
          key: telegram-post-state

      - name: Post new stories
        run: python scripts/telegram-post.py

      - name: Save last-sent state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: telegram-state.json
          key: telegram-post-state-${{ github.run_id }}